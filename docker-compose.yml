# Local development stack: pipeline database (Postgres) + Airflow.
#
# First time (or after a reset):  docker compose up airflow-init
# Then every day:                 docker compose up -d
# Stop (keeps all data):          docker compose down
# NEVER add -v to "down" unless you want to wipe the databases.
#
# Airflow UI: http://localhost:8080  (login: admin / admin, local use only)
# Pipeline database from your own computer: localhost:5432

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.2-python3.11
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-secret-change-me}
    # Extra Python packages our code needs (installed when the container starts).
    _PIP_ADDITIONAL_REQUIREMENTS: python-dotenv
    # Lets DAGs import our packages: ingestion, transform, db, config.
    PYTHONPATH: /opt/airflow/project
    PYTHONDONTWRITEBYTECODE: "1"
    # Inside Docker the pipeline database is reached by service name, not localhost.
    DB_HOST: postgres
    DB_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
    - airflow_logs:/opt/airflow/logs

services:
  # Pipeline data (raw, analytics, ops schemas). This is the database the team works with.
  postgres:
    image: postgres:15
    container_name: market_data_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Airflow's own bookkeeping database, kept separate so it never mixes with our tables.
  airflow-db:
    image: postgres:15
    container_name: market_data_airflow_db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: creates Airflow's tables and an admin login, then exits.
  airflow-init:
    <<: *airflow-common
    container_name: market_data_airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com \
          || echo "Admin user already exists")

  airflow-webserver:
    <<: *airflow-common
    container_name: market_data_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  airflow-scheduler:
    <<: *airflow-common
    container_name: market_data_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:
